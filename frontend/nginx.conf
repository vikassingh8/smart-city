server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: fall back to index.html for client-side routing.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API + health to the backend Service (name "api" inside Kubernetes,
  # overridable via the API_HOST build/run arg for other environments).
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
  }
  location /health {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
  }
}
