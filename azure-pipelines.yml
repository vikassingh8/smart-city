# Azure DevOps pipeline: test -> build images -> push to Azure Container
# Registry (ACR) -> deploy to AKS with a staging -> production approval gate via
# Environments.
#
# Service connections / variables to configure in Azure DevOps:
#   - azureSubscription : ARM service connection (used for ACR build and AKS deploy)
#   - ACR_NAME          : e.g. smartcityacr
#   - ACR_LOGIN_SERVER  : e.g. smartcityacr.azurecr.io
#   - AKS_RESOURCE_GROUP, AKS_CLUSTER_NAME

trigger:
  branches:
    include: [main]

variables:
  backendImage: '$(ACR_LOGIN_SERVER)/smart-city-backend'
  frontendImage: '$(ACR_LOGIN_SERVER)/smart-city-frontend'
  tag: '$(Build.SourceVersion)'

stages:
  - stage: Test
    jobs:
      - job: unit
        pool: { vmImage: 'ubuntu-latest' }
        steps:
          - task: NodeTool@0
            inputs: { versionSpec: '24.x' }
          - script: npm ci && npm test
            displayName: 'Install & unit tests'

  - stage: Build
    dependsOn: Test
    jobs:
      - job: images
        pool: { vmImage: 'ubuntu-latest' }
        steps:
          - task: AzureCLI@2
            displayName: 'Build & push images to ACR'
            inputs:
              azureSubscription: 'azureSubscription'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az acr build --registry $(ACR_NAME) -f Dockerfile \
                  --image smart-city-backend:$(tag) --image smart-city-backend:latest .
                az acr build --registry $(ACR_NAME) -f frontend/Dockerfile \
                  --image smart-city-frontend:$(tag) --image smart-city-frontend:latest frontend

  - stage: DeployStaging
    dependsOn: Build
    # Deploy only runs once AKS exists; set DEPLOY_ENABLED=true (and the AKS_*
    # variables) at demo time. Until then these stages are skipped, not failed.
    condition: and(succeeded(), eq(variables['DEPLOY_ENABLED'], 'true'))
    jobs:
      - deployment: staging
        environment: 'smart-city-staging'   # add approvals/checks here = gate
        pool: { vmImage: 'ubuntu-latest' }
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: 'azureSubscription'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az aks get-credentials -g $(AKS_RESOURCE_GROUP) -n $(AKS_CLUSTER_NAME) --overwrite-existing
                      cd k8s
                      kustomize edit set image \
                        smart-city-backend=$(backendImage):$(tag) \
                        smart-city-frontend=$(frontendImage):$(tag)
                      kubectl apply -k .
                      kubectl -n smart-city rollout status deploy/api --timeout=180s

  - stage: DeployProduction
    dependsOn: DeployStaging
    condition: and(succeeded(), eq(variables['DEPLOY_ENABLED'], 'true'))
    jobs:
      - deployment: production
        environment: 'smart-city-production'  # require reviewers here = prod gate
        pool: { vmImage: 'ubuntu-latest' }
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: 'azureSubscription'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az aks get-credentials -g $(AKS_RESOURCE_GROUP) -n $(AKS_CLUSTER_NAME) --overwrite-existing
                      cd k8s
                      kustomize edit set image \
                        smart-city-backend=$(backendImage):$(tag) \
                        smart-city-frontend=$(frontendImage):$(tag)
                      kubectl apply -k .
                      kubectl -n smart-city rollout status deploy/api --timeout=180s
