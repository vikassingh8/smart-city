# REST API - reads Azure Data Explorer (time-series) + Azure SQL (metadata).
# Exposed via a Service and autoscaled by an HPA.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: smart-city
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      serviceAccountName: smart-city-api   # least-privilege SA, see 12-rbac.yaml
      containers:
        - name: api
          image: smart-city-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "backend/server.js"]
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: smart-city-config }
            - secretRef: { name: smart-city-secrets }   # SQL_* credentials
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: smart-city
spec:
  type: LoadBalancer   # external IP on AKS; on local clusters use port-forward
  selector: { app: api }
  ports:
    - { port: 80, targetPort: 3000 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: smart-city
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
