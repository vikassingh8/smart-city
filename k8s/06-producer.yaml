# Ingestion service - simulates IoT sensors, publishes to Kafka sensor-data.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  namespace: smart-city
spec:
  replicas: 1
  selector:
    matchLabels: { app: producer }
  template:
    metadata:
      labels: { app: producer }
    spec:
      containers:
        - name: producer
          image: smart-city-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "backend/producer/producer.js"]
          envFrom:
            - configMapRef: { name: smart-city-config }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
