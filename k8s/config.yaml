# Non-secret configuration shared by the services (in-cluster DNS names), plus
# the least-privilege RBAC the API runs under.
apiVersion: v1
kind: ConfigMap
metadata:
  name: smart-city-config
  namespace: smart-city
data:
  KAFKA_BROKERS: "kafka:9092"
  # Azure Data Explorer endpoint (pods authenticate with the AKS managed
  # identity, granted Ingestor/Viewer in Terraform - no secret needed).
  KUSTO_QUERY_URI: "https://smartcityadx.centralindia.kusto.windows.net"
  KUSTO_DATABASE: "smartcity"
  TOPIC_RAW: "sensor-data"
  TOPIC_PROCESSED: "processed-data"
  API_PORT: "3000"
  PRODUCE_INTERVAL_MS: "2000"
  SQL_PORT: "1433"
  SQL_ENCRYPT: "true"
  SQL_TRUST_CERT: "false"
---
# Dedicated, least-privilege ServiceAccount for the API: read-only access to its
# own namespace's pods/configmaps/services, never cluster-admin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: smart-city-api
  namespace: smart-city
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: smart-city-api-reader
  namespace: smart-city
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: smart-city-api-reader-binding
  namespace: smart-city
subjects:
  - kind: ServiceAccount
    name: smart-city-api
    namespace: smart-city
roleRef:
  kind: Role
  name: smart-city-api-reader
  apiGroup: rbac.authorization.k8s.io
