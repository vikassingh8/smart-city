# Application workloads: the producer -> stream processor -> storage pipeline,
# the REST API (with Service + HPA), and the frontend dashboard.

# Ingestion service - simulates IoT sensors, publishes to Kafka sensor-data.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  namespace: smart-city
spec:
  replicas: 1
  selector:
    matchLabels: { app: producer }
  template:
    metadata:
      labels: { app: producer }
    spec:
      containers:
        - name: producer
          image: smart-city-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "backend/producer/producer.js"]
          envFrom:
            - configMapRef: { name: smart-city-config }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
---
# Stream processor - Apache Spark Structured Streaming. The job runs from the
# `spark-job` ConfigMap mounted at /app. Create it before applying:
#   kubectl -n smart-city create configmap spark-job \
#     --from-file=stream.py=backend/spark/stream.py \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-processor
  namespace: smart-city
spec:
  replicas: 1
  selector:
    matchLabels: { app: spark-processor }
  template:
    metadata:
      labels: { app: spark-processor }
    spec:
      containers:
        - name: spark
          image: apache/spark:3.5.1
          command:
            - /opt/spark/bin/spark-submit
            - --packages
            - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
            - --conf
            - spark.jars.ivy=/tmp/.ivy2
            - /app/stream.py
          env:
            - { name: KAFKA_BOOTSTRAP, value: "kafka:9092" }
          volumeMounts:
            - { name: job, mountPath: /app }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "1500m", memory: "2Gi" }
      volumes:
        - name: job
          configMap:
            name: spark-job
---
# Storage service - consumes processed-data, writes to Azure Data Explorer
# (time-series). Authenticates to ADX with the AKS managed identity.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage
  namespace: smart-city
spec:
  replicas: 1
  selector:
    matchLabels: { app: storage }
  template:
    metadata:
      labels: { app: storage }
    spec:
      containers:
        - name: storage
          image: smart-city-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "backend/consumer/consumer.js"]
          envFrom:
            - configMapRef: { name: smart-city-config }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
---
# REST API - reads Azure Data Explorer (time-series) + Azure SQL (metadata).
# Exposed via a Service and autoscaled by an HPA.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: smart-city
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      serviceAccountName: smart-city-api   # least-privilege SA, see config.yaml
      containers:
        - name: api
          image: smart-city-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "backend/server.js"]
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: smart-city-config }
            - secretRef: { name: smart-city-secrets }   # SQL_* credentials
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: smart-city
spec:
  type: LoadBalancer   # external IP on AKS; on local clusters use port-forward
  selector: { app: api }
  # Port 3000 matches the app and the frontend nginx proxy (proxy_pass api:3000),
  # so the dashboard reaches the API the same way under compose and Kubernetes.
  ports:
    - { port: 3000, targetPort: 3000 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: smart-city
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
# Frontend dashboard (React, served by nginx). Talks to the API Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: smart-city
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: smart-city-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits: { cpu: "100m", memory: "128Mi" }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: smart-city
spec:
  type: LoadBalancer
  selector: { app: frontend }
  ports:
    - { port: 80, targetPort: 80 }
