# Secret handling - applied separately from the kustomize stack, never with real
# values in git. Two options:
#
# 1) Quick (local/dev): create the Secret directly from your .env values:
#      kubectl -n smart-city create secret generic smart-city-secrets \
#        --from-literal=SQL_SERVER=mscsql.database.windows.net \
#        --from-literal=SQL_DATABASE=free-sql-db-7705584 \
#        --from-literal=SQL_USER=vikassingh \
#        --from-literal=SQL_PASSWORD='********'
#    The block below is a TEMPLATE for that Secret (do not commit real values).
#
# 2) Production (AKS): the SecretProviderClass at the bottom pulls the values
#    from Azure Key Vault via the Secrets Store CSI driver, so no secret material
#    ever lives in git.
apiVersion: v1
kind: Secret
metadata:
  name: smart-city-secrets
  namespace: smart-city
type: Opaque
stringData:
  SQL_SERVER: "mscsql.database.windows.net"
  SQL_DATABASE: "free-sql-db-7705584"
  SQL_USER: "vikassingh"
  SQL_PASSWORD: "REPLACE_ME"
---
# Azure Key Vault -> Kubernetes Secret via the Secrets Store CSI Driver.
# On AKS, enable the add-on:
#   az aks enable-addons --addons azure-keyvault-secrets-provider -g <rg> -n <aks>
# Then this pulls SQL_PASSWORD (etc.) from Key Vault at pod start. Uses workload
# identity / managed identity.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: smart-city-kv
  namespace: smart-city
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "<KEYVAULT_IDENTITY_CLIENT_ID>"
    keyvaultName: "smartcity-kv"
    tenantId: "<AZURE_TENANT_ID>"
    objects: |
      array:
        - |
          objectName: SQL-PASSWORD
          objectType: secret
        - |
          objectName: SQL-USER
          objectType: secret
        - |
          objectName: SQL-SERVER
          objectType: secret
        - |
          objectName: SQL-DATABASE
          objectType: secret
  # Mirror the mounted secrets into a normal K8s Secret the Deployment can use.
  secretObjects:
    - secretName: smart-city-secrets
      type: Opaque
      data:
        - { objectName: SQL-PASSWORD, key: SQL_PASSWORD }
        - { objectName: SQL-USER, key: SQL_USER }
        - { objectName: SQL-SERVER, key: SQL_SERVER }
        - { objectName: SQL-DATABASE, key: SQL_DATABASE }
