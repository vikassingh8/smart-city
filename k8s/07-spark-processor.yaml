# Stream processor - Apache Spark Structured Streaming. The job runs from the
# `spark-job` ConfigMap mounted at /app. Create it before applying:
#   kubectl -n smart-city create configmap spark-job \
#     --from-file=stream.py=backend/spark/stream.py \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-processor
  namespace: smart-city
spec:
  replicas: 1
  selector:
    matchLabels: { app: spark-processor }
  template:
    metadata:
      labels: { app: spark-processor }
    spec:
      containers:
        - name: spark
          image: apache/spark:3.5.1
          command:
            - /opt/spark/bin/spark-submit
            - --packages
            - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
            - --conf
            - spark.jars.ivy=/tmp/.ivy2
            - /app/stream.py
          env:
            - { name: KAFKA_BOOTSTRAP, value: "kafka:9092" }
          volumeMounts:
            - { name: job, mountPath: /app }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "1500m", memory: "2Gi" }
      volumes:
        - name: job
          configMap:
            name: spark-job
