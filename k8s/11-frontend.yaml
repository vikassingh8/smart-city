# Frontend dashboard (React, served by nginx). Talks to the API Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: smart-city
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: smart-city-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits: { cpu: "100m", memory: "128Mi" }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: smart-city
spec:
  type: LoadBalancer
  selector: { app: frontend }
  ports:
    - { port: 80, targetPort: 80 }
